
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Lelion62
          outputs: |
            dist/github-snake.svg?color_snake=FDE047&color_dots=0A0712,21103A,581C87,A855F7,FDE047
            dist/github-snake-dark.svg?color_snake=FDE047&color_dots=0A0712,21103A,581C87,A855F7,FDE047

      - name: Deploy Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
